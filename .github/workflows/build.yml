name: build

# One project, one top-level directory, one Dockerfile inside it. Whichever
# directory changed is the one that gets built.
#
# There is exactly one publish condition: **a push to main**. Pull requests and
# manual runs build but never push -- workflow_dispatch can target any branch,
# and without a ref check one click on a feature branch would push an unmerged
# recipe to GHCR and overwrite :latest, which downstream would read as a real
# release. The condition is written once (env.PUBLISH) and reused by the login,
# push, smoke-test and summary steps.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      image:
        description: 'Directory to build; empty = build all'
        required: false
        default: ''

# Least privilege by default; only the build job needs to write packages, and it
# asks for that itself.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.pick.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Diffing against base/before needs more than a shallow clone
          fetch-depth: 0

      - id: pick
        shell: bash
        env:
          DISPATCH_IMAGE: ${{ github.event.inputs.image }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          all_images() { find . -mindepth 2 -maxdepth 2 -name Dockerfile -printf '%h\n' | sed 's|^\./||' | sort; }

          # A change under .github/ rebuilds everything: the workflow itself
          # defines how every image is built, and picking "changed image
          # directories" would select none of them.
          changed_images() {
            local base="$1"
            local files
            files="$(git diff --name-only "${base}" "${GITHUB_SHA}")"
            if grep -q '^\.github/' <<<"${files}"; then all_images; return; fi
            # Any file in the directory triggers a rebuild: a Dockerfile
            # commonly COPYs things next to it.
            awk -F/ 'NF>1 {print $1}' <<<"${files}" | sort -u \
              | while read -r d; do [[ -f "${d}/Dockerfile" ]] && echo "${d}"; done
          }

          if [[ "${EVENT}" == "workflow_dispatch" && -n "${DISPATCH_IMAGE}" ]]; then
            if [[ ! -f "${DISPATCH_IMAGE}/Dockerfile" ]]; then
              echo "::error::no such file: ${DISPATCH_IMAGE}/Dockerfile" >&2; exit 1
            fi
            picked="${DISPATCH_IMAGE}"
          elif [[ "${EVENT}" == "workflow_dispatch" ]]; then
            picked="$(all_images)"
          elif [[ "${EVENT}" == "pull_request" ]]; then
            picked="$(changed_images "${BASE_SHA}")"
          elif [[ -n "${BEFORE}" && "${BEFORE}" != "0000000000000000000000000000000000000000" ]] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            picked="$(changed_images "${BEFORE}")"
          else
            # First push on a branch, or `before` already garbage-collected:
            # nothing to diff against, so build everything rather than silently
            # skip something.
            echo "::notice::no comparable baseline, building all images"
            picked="$(all_images)"
          fi

          # The directory name ends up inside an image reference and inside a
          # shell, and a PR author gets to choose it. So the format is locked
          # down before it reaches the matrix: this rejects quotes, command
          # substitution and friends, and also uppercase letters (a GHCR
          # repository path must be lowercase).
          while read -r d; do
            [[ -z "${d}" ]] && continue
            [[ "${d}" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || {
              echo "::error::invalid image directory name: ${d} (lowercase letters and digits only, with . _ - as separators)" >&2
              exit 1
            }
          done <<<"${picked}"

          echo "picked: ${picked:-(none)}"
          # An empty result still has to be valid JSON, or fromJSON downstream
          # fails outright.
          echo "images=$(jq -R -s -c 'split("\n") | map(select(length > 0))' <<<"${picked}")" >> "${GITHUB_OUTPUT}"

  build:
    needs: discover
    if: needs.discover.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.discover.outputs.images) }}
    env:
      IMAGE: ${{ matrix.image }}
      # The one publish condition. False for manual runs and pull requests.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble image reference
        id: name
        shell: bash
        run: |
          set -euo pipefail
          # The directory name arrives through an environment variable rather
          # than being interpolated into the script: interpolation is textual
          # substitution done before the shell starts, so a name containing a
          # quote is code injection. (discover already validated the format;
          # this is the second line of defence, not a substitute for it.)
          # Note: a GHCR repository path must be all lowercase, and the org is
          # spelled CYL-Logan-Lab.
          # Careful: even comments inside a run block are parsed for workflow
          # expressions, so none of this prose may use that syntax.
          owner="$(tr '[:upper:]' '[:lower:]' <<<"${OWNER}")"
          echo "ref=ghcr.io/${owner}/${IMAGE}" >> "${GITHUB_OUTPUT}"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: docker/setup-buildx-action@v3

      # No publish, no login: a fork PR has no token that can write packages, so
      # logging in would only fail for nothing.
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (+ push on main)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          push: ${{ env.PUBLISH == 'true' }}
          # When not publishing, load the image into the local docker so the
          # next step can actually run it.
          load: ${{ env.PUBLISH != 'true' }}
          provenance: false
          tags: |
            ${{ steps.name.outputs.ref }}:latest
            ${{ steps.name.outputs.ref }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # The smoke test has to live outside the Dockerfile. As a layer inside the
      # image it would be skipped on a cache hit -- the build would not have run
      # a single R process while still looking "verified".
      # This runs the image this build actually produced: when publishing, pulled
      # back by digest (so the pushed artifact itself is what gets tested);
      # otherwise the one just loaded locally.
      - name: Smoke test the image this build produced
        shell: bash
        env:
          REF: ${{ steps.name.outputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${PUBLISH}" == "true" ]]; then img="${REF}@${DIGEST}"; else img="${REF}:${SHA}"; fi
          echo "smoke testing ${img}"
          if [[ -f "${IMAGE}/smoke-test.R" ]]; then
            docker run --rm --network none \
              --mount "type=bind,src=${PWD}/${IMAGE}/smoke-test.R,dst=/tmp/smoke-test.R,readonly" \
              "${img}" Rscript --vanilla /tmp/smoke-test.R
            exit 0
          fi
          docker run --rm --network none "${img}" Rscript --vanilla -e '
            suppressPackageStartupMessages({
              library(Seurat); library(scDblFinder)
              library(clusterProfiler); library(org.Hs.eg.db); library(ReactomePA)
            })
            stopifnot(file.exists("/opt/Renv-manifest.tsv"))
            # --network none is the point of this line: enrichment must work with
            # no network at all, otherwise the gene sets are not really in the image.
            # Each of the three back-ends is exercised separately -- they read
            # different databases (org.Hs.eg.db, reactome.db) and a working GO
            # query says nothing about whether reactome.db shipped intact.
            eg <- suppressMessages(bitr(c("POSTN","COL1A1","COL3A1","COL6A1","COL5A1",
                                          "DCN","LUM","FN1","FBN1","SPARC","TGFB1","MMP2"),
                                        "SYMBOL", "ENTREZID", org.Hs.eg.db))
            go <- enrichGO(eg$ENTREZID, OrgDb = org.Hs.eg.db, ont = "BP",
                           pvalueCutoff = 0.05, readable = TRUE)
            re <- ReactomePA::enrichPathway(eg$ENTREZID, pvalueCutoff = 0.05, readable = TRUE)
            stopifnot(nrow(as.data.frame(go)) > 0, nrow(as.data.frame(re)) > 0)
            # enrichplot is only ever used to draw; building the plot object is
            # what catches a broken install, so build one and throw it away.
            invisible(ggplot2::ggplot_build(enrichplot::dotplot(go, showCategory = 5)))
            # fgsea needs a ranked vector rather than a gene list, so give it one,
            # and a gene set that is a strict subset of it -- a set equal to the
            # whole ranking is degenerate and would pass without testing anything.
            # fgseaSimple by name: the permutation path reached via fgsea(nperm=)
            # is deprecated and a deprecation warning here would be noise.
            set.seed(1)
            rk <- setNames(seq(2, -2, length.out = length(eg$ENTREZID)), eg$ENTREZID)
            fg <- fgsea::fgseaSimple(list(top = eg$ENTREZID[1:5]), rk, minSize = 2, nperm = 200)
            stopifnot(nrow(fg) == 1, is.finite(fg$ES))
            cat("smoke ok:", R.version.string,
                "/ Seurat", as.character(packageVersion("Seurat")),
                "/ scDblFinder", as.character(packageVersion("scDblFinder")),
                "/ clusterProfiler", as.character(packageVersion("clusterProfiler")),
                "/ offline enrichGO", nrow(as.data.frame(go)), "terms",
                "/ enrichPathway", nrow(as.data.frame(re)), "pathways\n")'

      - name: Report digest
        shell: bash
        env:
          REF: ${{ steps.name.outputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          {
            printf '### `%s`\n\n' "${IMAGE}"
            if [[ "${PUBLISH}" == "true" ]]; then
              echo "Reference this from downstream by digest (do **not** pin an environment to \`:latest\`):"
              echo
              echo '```'
              echo "${REF}@${DIGEST}"
              echo '```'
            else
              echo "Built but not pushed (only a push to \`main\` publishes). The recipe builds and the smoke test passed."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
