name: build

# One project, one top-level directory, one Dockerfile inside it. Whichever
# directory changed is the one that gets built.
#
# There is exactly one publish condition: **a push to main**. Pull requests and
# manual runs build but never push -- workflow_dispatch can target any branch,
# and without a ref check one click on a feature branch would push an unmerged
# recipe to GHCR and overwrite :latest, which downstream would read as a real
# release. The condition is written once (env.PUBLISH) and reused by the login,
# push, smoke-test and summary steps.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      image:
        description: 'Directory to build; empty = build all'
        required: false
        default: ''

# Least privilege by default; only the build job needs to write packages, and it
# asks for that itself.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.pick.outputs.images }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Diffing against base/before needs more than a shallow clone
          fetch-depth: 0

      - id: pick
        shell: bash
        env:
          DISPATCH_IMAGE: ${{ github.event.inputs.image }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          all_images() { find . -mindepth 2 -maxdepth 2 -name Dockerfile -printf '%h\n' | sed 's|^\./||' | sort; }

          # A change under .github/ rebuilds everything: the workflow itself
          # defines how every image is built, and picking "changed image
          # directories" would select none of them.
          changed_images() {
            local base="$1"
            local files
            files="$(git diff --name-only "${base}" "${GITHUB_SHA}")"
            if grep -q '^\.github/' <<<"${files}"; then all_images; return; fi
            # Any file in the directory triggers a rebuild: a Dockerfile
            # commonly COPYs things next to it.
            awk -F/ 'NF>1 {print $1}' <<<"${files}" | sort -u \
              | while read -r d; do [[ -f "${d}/Dockerfile" ]] && echo "${d}"; done
          }

          if [[ "${EVENT}" == "workflow_dispatch" && -n "${DISPATCH_IMAGE}" ]]; then
            if [[ ! -f "${DISPATCH_IMAGE}/Dockerfile" ]]; then
              echo "::error::no such file: ${DISPATCH_IMAGE}/Dockerfile" >&2; exit 1
            fi
            picked="${DISPATCH_IMAGE}"
          elif [[ "${EVENT}" == "workflow_dispatch" ]]; then
            picked="$(all_images)"
          elif [[ "${EVENT}" == "pull_request" ]]; then
            picked="$(changed_images "${BASE_SHA}")"
          elif [[ -n "${BEFORE}" && "${BEFORE}" != "0000000000000000000000000000000000000000" ]] \
               && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            picked="$(changed_images "${BEFORE}")"
          else
            # First push on a branch, or `before` already garbage-collected:
            # nothing to diff against, so build everything rather than silently
            # skip something.
            echo "::notice::no comparable baseline, building all images"
            picked="$(all_images)"
          fi

          # The directory name ends up inside an image reference and inside a
          # shell, and a PR author gets to choose it. So the format is locked
          # down before it reaches the matrix: this rejects quotes, command
          # substitution and friends, and also uppercase letters (a GHCR
          # repository path must be lowercase).
          while read -r d; do
            [[ -z "${d}" ]] && continue
            [[ "${d}" =~ ^[a-z0-9]+([._-][a-z0-9]+)*$ ]] || {
              echo "::error::invalid image directory name: ${d} (lowercase letters and digits only, with . _ - as separators)" >&2
              exit 1
            }
          done <<<"${picked}"

          echo "picked: ${picked:-(none)}"
          # An empty result still has to be valid JSON, or fromJSON downstream
          # fails outright.
          echo "images=$(jq -R -s -c 'split("\n") | map(select(length > 0))' <<<"${picked}")" >> "${GITHUB_OUTPUT}"

  build:
    needs: discover
    if: needs.discover.outputs.images != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.discover.outputs.images) }}
    env:
      IMAGE: ${{ matrix.image }}
      # The one publish condition. False for manual runs and pull requests.
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble image reference
        id: name
        shell: bash
        run: |
          set -euo pipefail
          # The directory name arrives through an environment variable rather
          # than being interpolated into the script: interpolation is textual
          # substitution done before the shell starts, so a name containing a
          # quote is code injection. (discover already validated the format;
          # this is the second line of defence, not a substitute for it.)
          # Note: a GHCR repository path must be all lowercase, and the org is
          # spelled CYL-Logan-Lab.
          # Careful: even comments inside a run block are parsed for workflow
          # expressions, so none of this prose may use that syntax.
          owner="$(tr '[:upper:]' '[:lower:]' <<<"${OWNER}")"
          echo "ref=ghcr.io/${owner}/${IMAGE}" >> "${GITHUB_OUTPUT}"
        env:
          OWNER: ${{ github.repository_owner }}

      - uses: docker/setup-buildx-action@v3

      # No publish, no login: a fork PR has no token that can write packages, so
      # logging in would only fail for nothing.
      - uses: docker/login-action@v3
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (+ push on main)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          push: ${{ env.PUBLISH == 'true' }}
          # When not publishing, load the image into the local docker so the
          # next step can actually run it.
          load: ${{ env.PUBLISH != 'true' }}
          provenance: false
          tags: |
            ${{ steps.name.outputs.ref }}:latest
            ${{ steps.name.outputs.ref }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max

      # The smoke test has to live outside the Dockerfile. As a layer inside the
      # image it would be skipped on a cache hit -- the build would not have run
      # a single R process while still looking "verified".
      # This runs the image this build actually produced: when publishing, pulled
      # back by digest (so the pushed artifact itself is what gets tested);
      # otherwise the one just loaded locally.
      - name: Smoke test the image this build produced
        shell: bash
        env:
          REF: ${{ steps.name.outputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ "${PUBLISH}" == "true" ]]; then img="${REF}@${DIGEST}"; else img="${REF}:${SHA}"; fi
          echo "smoke testing ${img}"
          docker run --rm --network none "${img}" Rscript --vanilla -e '
            suppressPackageStartupMessages({
              library(Seurat); library(scDblFinder)
              library(clusterProfiler); library(org.Hs.eg.db); library(ReactomePA)
              library(CellChat); library(nichenetr)
            })
            stopifnot(file.exists("/opt/Renv-manifest.tsv"))
            # --network none is the point of this line: enrichment must work with
            # no network at all, otherwise the gene sets are not really in the image.
            # Each of the three back-ends is exercised separately -- they read
            # different databases (org.Hs.eg.db, reactome.db) and a working GO
            # query says nothing about whether reactome.db shipped intact.
            eg <- suppressMessages(bitr(c("POSTN","COL1A1","COL3A1","COL6A1","COL5A1",
                                          "DCN","LUM","FN1","FBN1","SPARC","TGFB1","MMP2"),
                                        "SYMBOL", "ENTREZID", org.Hs.eg.db))
            go <- enrichGO(eg$ENTREZID, OrgDb = org.Hs.eg.db, ont = "BP",
                           pvalueCutoff = 0.05, readable = TRUE)
            re <- ReactomePA::enrichPathway(eg$ENTREZID, pvalueCutoff = 0.05, readable = TRUE)
            stopifnot(nrow(as.data.frame(go)) > 0, nrow(as.data.frame(re)) > 0)
            # enrichplot is only ever used to draw; building the plot object is
            # what catches a broken install, so build one and throw it away.
            invisible(ggplot2::ggplot_build(enrichplot::dotplot(go, showCategory = 5)))
            # fgsea needs a ranked vector rather than a gene list, so give it one,
            # and a gene set that is a strict subset of it -- a set equal to the
            # whole ranking is degenerate and would pass without testing anything.
            # fgseaSimple by name: the permutation path reached via fgsea(nperm=)
            # is deprecated and a deprecation warning here would be noise.
            set.seed(1)
            rk <- setNames(seq(2, -2, length.out = length(eg$ENTREZID)), eg$ENTREZID)
            fg <- fgsea::fgseaSimple(list(top = eg$ENTREZID[1:5]), rk, minSize = 2, nperm = 200)
            stopifnot(nrow(fg) == 1, is.finite(fg$ES))
            # ---- cell-cell communication stack, all of it under --network none ----
            # CellChatDB ships inside the package; this is what verifies that claim.
            db <- CellChatDB.human$interaction
            stopifnot(is.data.frame(db), nrow(db) > 0,
                      all(c("SPP1", "CSF1", "PDGFA") %in% db$ligand))
            # A loadable CellChat says nothing about whether inference runs: the
            # probability step is C++ over a database subset and is where a broken
            # build actually shows. So run the whole chain on a toy object built to
            # have a known answer -- group A carries the ligands, B the receptors,
            # so A -> B must come out non-empty. The genes that carry the signal
            # are fixed by name; only the background genes are drawn from the DB,
            # which is what keeps the object big enough for the filtering steps to
            # have something to do.
            set.seed(1)
            lig <- c("SPP1", "CSF1", "TGFB1", "PDGFA")
            rec <- c("CD44", "CSF1R", "TGFBR1", "TGFBR2", "PDGFRA", "PDGFRB")
            fil <- setdiff(unique(c(db$ligand, db$receptor)), c(lig, rec))
            genes <- c(lig, rec, grep("_", fil, invert = TRUE, value = TRUE)[1:200])
            n <- 40L
            m <- matrix(rpois(length(genes) * 2L * n, lambda = 2), nrow = length(genes),
                        dimnames = list(genes, paste0("c", seq_len(2L * n))))
            m[lig, seq_len(n)] <- m[lig, seq_len(n)] + 60L
            m[rec, -seq_len(n)] <- m[rec, -seq_len(n)] + 60L
            dat <- log1p(sweep(m, 2, colSums(m), "/") * 1e4)
            meta <- data.frame(labels = factor(rep(c("A", "B"), each = n)),
                               row.names = colnames(m))
            cc <- createCellChat(object = dat, meta = meta, group.by = "labels")
            cc@DB <- CellChatDB.human
            cc <- subsetData(cc)
            cc <- identifyOverExpressedGenes(cc, thresh.p = 1)
            cc <- identifyOverExpressedInteractions(cc)
            cc <- computeCommunProb(cc, type = "truncatedMean", trim = 0.1)
            cc <- filterCommunication(cc, min.cells = 10)
            cc <- aggregateNet(cc)
            net <- cc@net$count
            stopifnot(is.matrix(net), identical(dim(net), c(2L, 2L)),
                      net["A", "B"] > 0, nrow(subsetCommunication(cc)) > 0)
            # NicheNet priors are the one database not shipped by its package, so
            # they were baked in by the Dockerfile. Read from the env var the image
            # sets rather than a literal path: a missing ENV then fails here too.
            prior <- Sys.getenv("NICHENET_PRIOR_DIR")
            stopifnot(nzchar(prior))
            ltm <- readRDS(file.path(prior, "ligand_target_matrix_nsga2r_final.rds"))
            # Orientation is targets x ligands. Asserting only that ligands are in
            # colnames would not catch a transposed matrix -- ligands are genes and
            # so appear in both margins. Targets appearing in rownames but NOT all
            # in colnames is the pair of checks that pins it.
            stopifnot(is.matrix(ltm), nrow(ltm) > 1e4, ncol(ltm) > 1e3,
                      all(c("SPP1", "CSF1", "TGFB1") %in% colnames(ltm)),
                      all(c("CD44", "CSF1R", "COL1A1") %in% rownames(ltm)),
                      !all(c("CD44", "CSF1R", "COL1A1") %in% colnames(ltm)),
                      min(ltm[, "SPP1"]) >= 0)
            lr <- readRDS(file.path(prior, "lr_network_human_21122021.rds"))
            stopifnot(is.data.frame(lr), nrow(lr) > 0,
                      all(c("from", "to") %in% colnames(lr)),
                      any(lr$from == "SPP1" & lr$to == "CD44"),
                      any(lr$from == "CSF1" & lr$to == "CSF1R"))
            # Reading the priors is not the same as nichenetr being able to use
            # them, so call the function the downstream step will call, on a
            # question whose answer is fixed by construction: background = the
            # 2000 highest-scoring targets of SPP1, geneset = the top 100 of
            # those. SPP1 then separates the geneset perfectly, so its AUROC is
            # exactly 1 -- provided score[100] is strictly above score[101],
            # which is asserted rather than assumed because a tie at that
            # boundary is the one thing that would break the equality.
            #
            # AUROC and not pearson: pearson correlates against the binary
            # membership vector and is NOT maximised by the ligand that defined
            # the set (APOE beats SPP1 on it), so a pearson assertion would have
            # an expected value that was guessed rather than derived.
            #
            # No sample() anywhere here, deliberately. An earlier version drew a
            # random background and justified it as "the property holds for any
            # subset". That justification is false: subsets exist where another
            # candidate reaches AUROC 1 and SPP1 lands just below it (TNF 1.0 vs
            # SPP1 0.9999974 on one such draw). Since this runs unattended in CI,
            # the check is deterministic instead -- identical numbers on every
            # run, so it cannot pass today and flake next month.
            cand <- intersect(c("SPP1", "CSF1", "TGFB1", "PDGFA", "IL34", "GAS6",
                                "CXCL12", "APOE", "FN1", "IL6", "TNF"), colnames(ltm))
            sc <- sort(ltm[, "SPP1"], decreasing = TRUE)
            stopifnot(length(cand) > 5, sc[[100]] > sc[[101]])
            bg <- names(sc)[1:2000]
            gs <- names(sc)[1:100]
            act <- nichenetr::predict_ligand_activities(
              geneset = gs, background_expressed_genes = bg,
              ligand_target_matrix = ltm[bg, cand, drop = FALSE],
              potential_ligands = cand)
            au <- setNames(act$auroc, act$test_ligand)
            stopifnot(nrow(act) == length(cand), all(is.finite(au)),
                      identical(sort(names(au)), sort(cand)),
                      au[["SPP1"]] == 1, sum(au >= au[["SPP1"]]) == 1L)
            cat("smoke ok:", R.version.string,
                "/ Seurat", as.character(packageVersion("Seurat")),
                "/ scDblFinder", as.character(packageVersion("scDblFinder")),
                "/ clusterProfiler", as.character(packageVersion("clusterProfiler")),
                "/ offline enrichGO", nrow(as.data.frame(go)), "terms",
                "/ enrichPathway", nrow(as.data.frame(re)), "pathways",
                "/ CellChat", as.character(packageVersion("CellChat")),
                "with", nrow(db), "interactions, toy A->B", net["A", "B"],
                "/ nichenetr", as.character(packageVersion("nichenetr")),
                "priors", nrow(ltm), "targets x", ncol(ltm), "ligands,",
                nrow(lr), "LR pairs, SPP1 auroc", au[["SPP1"]],
                "vs runner-up", round(max(au[names(au) != "SPP1"]), 4), "\n")'

      - name: Report digest
        shell: bash
        env:
          REF: ${{ steps.name.outputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          {
            printf '### `%s`\n\n' "${IMAGE}"
            if [[ "${PUBLISH}" == "true" ]]; then
              echo "Reference this from downstream by digest (do **not** pin an environment to \`:latest\`):"
              echo
              echo '```'
              echo "${REF}@${DIGEST}"
              echo '```'
            else
              echo "Built but not pushed (only a push to \`main\` publishes). The recipe builds and the smoke test passed."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
